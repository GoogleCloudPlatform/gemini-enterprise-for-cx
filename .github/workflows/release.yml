name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Tag or ref to package'
        required: true
      wordpress_org_dry_run:
        description: 'WordPress.org: check out SVN and show the diff without committing. Only a v* tag ref can commit.'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  package:
    name: Build release archive
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '7.4'
          coverage: none

      - name: Verify version declarations agree
        run: php .github/scripts/check-version.php

      - name: Verify the tag matches the plugin version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          version="$(sed -n 's/^ \* Version:[[:space:]]*\(.*\)$/\1/p' gecx-agent.php | tr -d '[:space:]')"
          if [ "$tag" != "$version" ]; then
            echo "Tag v${tag} does not match the plugin version ${version}." >&2
            exit 1
          fi
          echo "Tag and plugin version both ${version}."

      - name: Build the archive
        # git archive honours the export-ignore rules in .gitattributes, so the
        # zip contains only what a store should install. Zipping the working
        # tree by hand does not, and ships tests/ and the CI config.
        run: |
          version="$(sed -n 's/^ \* Version:[[:space:]]*\(.*\)$/\1/p' gecx-agent.php | tr -d '[:space:]')"
          mkdir -p build
          git archive --format=zip \
            --prefix=gemini-enterprise-for-cx/ \
            --output="build/gemini-enterprise-for-cx-${version}.zip" \
            HEAD
          unzip -l "build/gemini-enterprise-for-cx-${version}.zip"

      - name: Fail if the archive contains development files
        run: |
          version="$(sed -n 's/^ \* Version:[[:space:]]*\(.*\)$/\1/p' gecx-agent.php | tr -d '[:space:]')"
          if unzip -l "build/gemini-enterprise-for-cx-${version}.zip" \
            | grep -E 'tests/|\.github/|phpunit\.xml|phpcs\.xml|composer\.(json|lock)|package(-lock)?\.json|playwright\.config'; then
            echo "Development files leaked into the release archive." >&2
            exit 1
          fi
          echo "Archive contains plugin files only."

      - name: Upload the archive as a build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: plugin-zip
          path: build/*.zip
          if-no-files-found: error

      - name: Attach the archive to the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: build/*.zip

  # Uploads the same archive to the WooCommerce.com Marketplace listing
  # (https://woocommerce.com/products/gemini-enterprise-for-cx/). The deploy
  # endpoint only updates an existing product; Woo then runs its own QIT checks
  # before publishing the version. A manual run with a v* tag as the ref
  # redeploys that tag.
  woocommerce:
    name: Deploy to WooCommerce.com
    needs: package
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.event.inputs.ref, 'v')
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Download the archive
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: plugin-zip
          path: build

      - name: Deploy to WooCommerce.com
        env:
          WOO_USER: ${{ secrets.WOO_DEPLOY_USER }}
          WOO_PASS: ${{ secrets.WOO_DEPLOY_APP_PASSWORD }}
          WOO_PRODUCT_ID: ${{ vars.WOO_PRODUCT_ID || secrets.WOO_PRODUCT_ID || '18734006901326' }}
        run: |
          if [ -z "${WOO_USER}" ] || [ -z "${WOO_PASS}" ]; then
            echo "WOO_DEPLOY_USER and WOO_DEPLOY_APP_PASSWORD must be set to deploy to WooCommerce.com." >&2
            exit 1
          fi
          zip_path="$(ls build/gemini-enterprise-for-cx-*.zip)"
          version="$(basename "${zip_path}" .zip)"
          version="${version#gemini-enterprise-for-cx-}"
          echo "Deploying ${zip_path} as version ${version}."
          curl --silent --show-error --fail-with-body -X POST \
            https://woocommerce.com/wp-json/wc/submission/runner/v1/product/deploy \
            -F "file=@${zip_path}" \
            -F "product_id=${WOO_PRODUCT_ID}" \
            -F "username=${WOO_USER}" \
            -F "password=${WOO_PASS}" \
            -F "version=${version}"
          echo

      - name: Report WooCommerce.com deploy status
        env:
          WOO_USER: ${{ secrets.WOO_DEPLOY_USER }}
          WOO_PASS: ${{ secrets.WOO_DEPLOY_APP_PASSWORD }}
          WOO_PRODUCT_ID: ${{ vars.WOO_PRODUCT_ID || secrets.WOO_PRODUCT_ID || '18734006901326' }}
        run: |
          # Woo processes the upload asynchronously. Print the status a few
          # times so the run log shows how the deploy is progressing; review
          # results also arrive by email and in the vendor dashboard.
          for attempt in 1 2 3 4 5 6; do
            sleep 30
            echo "Status check ${attempt}:"
            curl --silent --show-error --fail-with-body -X POST \
              https://woocommerce.com/wp-json/wc/submission/runner/v1/product/deploy/status \
              -F "product_id=${WOO_PRODUCT_ID}" \
              -F "username=${WOO_USER}" \
              -F "password=${WOO_PASS}"
            echo
          done

  # Commits the release to the WordPress.org Plugin Directory
  # (https://wordpress.org/plugins/gemini-enterprise-for-cx/): trunk, a
  # tags/<version> copy, and the listing assets in .wordpress-org/. Trunk is
  # built with git archive, so the export-ignore rules in .gitattributes keep
  # it identical to the release zip. The action skips versions already tagged
  # in SVN.
  #
  # Tag pushes commit for real. Manual runs are dry runs (SVN checkout and diff,
  # no commit) unless the ref is a v* tag and wordpress_org_dry_run is false.
  wordpress-org:
    name: Deploy to WordPress.org
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Read the plugin version
        id: version
        run: |
          version="$(sed -n 's/^ \* Version:[[:space:]]*\(.*\)$/\1/p' gecx-agent.php | tr -d '[:space:]')"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Deploy to the WordPress.org SVN repository
        uses: 10up/action-wordpress-plugin-deploy@54bd289b8525fd23a5c365ec369185f2966529c2 # 2.3.0
        with:
          dry-run: ${{ !(startsWith(github.ref, 'refs/tags/v') || (startsWith(github.event.inputs.ref, 'v') && github.event.inputs.wordpress_org_dry_run == 'false')) }}
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: gemini-enterprise-for-cx
          VERSION: ${{ steps.version.outputs.version }}
