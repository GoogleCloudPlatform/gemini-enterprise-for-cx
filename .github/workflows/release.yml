name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Tag or ref to package'
        required: true

permissions:
  contents: write

jobs:
  package:
    name: Build release archive
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '7.4'
          coverage: none

      - name: Verify version declarations agree
        run: php .github/scripts/check-version.php

      - name: Verify the tag matches the plugin version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          version="$(sed -n 's/^ \* Version:[[:space:]]*\(.*\)$/\1/p' gecx-agent.php | tr -d '[:space:]')"
          if [ "$tag" != "$version" ]; then
            echo "Tag v${tag} does not match the plugin version ${version}." >&2
            exit 1
          fi
          echo "Tag and plugin version both ${version}."

      - name: Build the archive
        # git archive honours the export-ignore rules in .gitattributes, so the
        # zip contains only what a store should install. Zipping the working
        # tree by hand does not, and ships tests/ and the CI config.
        run: |
          version="$(sed -n 's/^ \* Version:[[:space:]]*\(.*\)$/\1/p' gecx-agent.php | tr -d '[:space:]')"
          mkdir -p build
          git archive --format=zip \
            --prefix=gemini-enterprise-for-cx/ \
            --output="build/gemini-enterprise-for-cx-${version}.zip" \
            HEAD
          unzip -l "build/gemini-enterprise-for-cx-${version}.zip"

      - name: Fail if the archive contains development files
        run: |
          version="$(sed -n 's/^ \* Version:[[:space:]]*\(.*\)$/\1/p' gecx-agent.php | tr -d '[:space:]')"
          if unzip -l "build/gemini-enterprise-for-cx-${version}.zip" \
            | grep -E 'tests/|\.github/|phpunit\.xml|phpcs\.xml|composer\.(json|lock)'; then
            echo "Development files leaked into the release archive." >&2
            exit 1
          fi
          echo "Archive contains plugin files only."

      - name: Upload the archive as a build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: plugin-zip
          path: build/*.zip
          if-no-files-found: error

      - name: Attach the archive to the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
        with:
          files: build/*.zip
