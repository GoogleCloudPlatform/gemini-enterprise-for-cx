name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  phpunit:
    name: PHPUnit (PHP ${{ matrix.php-version }})
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mariadb:lts
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: true
          MARIADB_DATABASE: wordpress_test
        ports:
          - 3306
        options: --health-cmd="healthcheck.sh --su-mysql --connect --innodb_initialized" --health-interval=10s --health-timeout=5s --health-retries=3
    env:
      WP_DB_NAME: wordpress_test
      WP_DB_USER: root
      WP_DB_PASS: ''
    strategy:
      fail-fast: false
      matrix:
        php-version: ['7.4', '8.0', '8.1', '8.2', '8.3', '8.4']

    steps:
      - name: Configure database host
        run: echo "WP_DB_HOST=127.0.0.1:${{ job.services.mysql.ports[3306] }}" >> "$GITHUB_ENV"

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: openssl, json, mbstring, curl, mysqli
          tools: composer
          coverage: ${{ matrix.php-version == '8.2' && 'pcov' || 'none' }}

      - name: Install dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0

      - name: Cache WooCommerce
        id: cache-woocommerce
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: vendor/woocommerce/woocommerce
          key: woocommerce-9.9.0

      - name: Download WooCommerce
        if: steps.cache-woocommerce.outputs.cache-hit != 'true'
        run: |
          mkdir -p vendor/woocommerce
          curl -sSL -o woocommerce.zip https://downloads.wordpress.org/plugin/woocommerce.9.9.0.zip
          unzip -q woocommerce.zip -d vendor/woocommerce/
          rm woocommerce.zip

      - name: Wait for database
        run: |
          while ! mysqladmin ping -h"127.0.0.1" -P"${{ job.services.mysql.ports[3306] }}" --silent; do
            sleep 1
          done

      - name: Run PHPUnit single-site tests with coverage
        if: matrix.php-version == '8.2'
        run: |
          set -o pipefail
          vendor/bin/phpunit --configuration phpunit.xml.dist --coverage-text --coverage-clover clover.xml | tee coverage.txt
          echo "### Test Coverage Summary (PHP 8.2)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          sed -n '/Code Coverage Report:/,$p' coverage.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: matrix.php-version == '8.2'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-clover
          path: clover.xml
          if-no-files-found: error
          retention-days: 14

      - name: Run PHPUnit multisite tests (coverage job)
        if: matrix.php-version == '8.2'
        run: vendor/bin/phpunit --configuration phpunit-multisite.xml.dist

      - name: Run PHPUnit single-site tests
        if: matrix.php-version != '8.2'
        run: vendor/bin/phpunit --configuration phpunit.xml.dist

      - name: Run PHPUnit multisite tests
        if: matrix.php-version != '8.2'
        run: vendor/bin/phpunit --configuration phpunit-multisite.xml.dist
