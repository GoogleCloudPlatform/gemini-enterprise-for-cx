name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  phpunit:
    name: PHPUnit (PHP ${{ matrix.php-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['7.4', '8.0', '8.1', '8.2', '8.3', '8.4']

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: openssl, json, mbstring, curl
          tools: phpunit:9.6.36
          coverage: ${{ matrix.php-version == '8.2' && 'pcov' || 'none' }}

      - name: Generate autoloader
        run: composer dump-autoload -o

      - name: Run PHPUnit tests with coverage
        if: matrix.php-version == '8.2'
        run: |
          # Without pipefail the exit status of the pipeline is tee's, so a
          # failing suite would report success.
          set -o pipefail
          phpunit --configuration phpunit.xml.dist --coverage-text --coverage-clover clover.xml | tee coverage.txt
          echo "### Test Coverage Summary (PHP 8.2)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          sed -n '/Code Coverage Report:/,$p' coverage.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: matrix.php-version == '8.2'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-clover
          path: clover.xml
          if-no-files-found: error
          retention-days: 14

      - name: Run PHPUnit tests
        if: matrix.php-version != '8.2'
        run: phpunit --configuration phpunit.xml.dist
