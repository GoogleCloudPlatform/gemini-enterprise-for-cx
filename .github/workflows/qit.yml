name: QIT

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  qit:
    name: WooCommerce QIT
    # Not ubuntu-latest: that label moved to Ubuntu 26.04, and the Playwright
    # version QIT's activation package pins (1.54) has no browser builds for
    # it. qit-cli ignores the failed `npx playwright install`, so the run
    # then fails its first test on a missing headless_shell executable.
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    env:
      NO_COLOR: 1
      QIT_DISABLE_ONBOARDING: yes

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '7.4'
          coverage: none

      - name: Install dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies and build assets
        run: |
          npm ci
          npm run build

      - name: Build plugin ZIP
        id: build
        run: |
          version="$(sed -n 's/^ \* Version:[[:space:]]*\(.*\)$/\1/p' gecx-agent.php | tr -d '[:space:]')"
          mkdir -p build/staging/gemini-enterprise-for-cx dist
          rsync -rc --exclude-from=.distignore --exclude='vendor/*' ./ build/staging/gemini-enterprise-for-cx/
          mkdir -p build/staging/gemini-enterprise-for-cx/vendor
          composer dump-autoload -o --classmap-authoritative --no-dev
          cp -r vendor/composer vendor/autoload.php build/staging/gemini-enterprise-for-cx/vendor/
          composer dump-autoload -o
          zip_path="dist/gemini-enterprise-for-cx-${version}.zip"
          (cd build/staging && zip -q -r "../../${zip_path}" gemini-enterprise-for-cx)
          rm -rf build/staging
          echo "zip=${zip_path}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Validate ZIP with QIT
        env:
          PLUGIN_ZIP: ${{ steps.build.outputs.zip }}
        run: |
          vendor/bin/qit woo:validate-zip "${PLUGIN_ZIP}"

      - name: Add QIT partner
        id: partner
        env:
          PARTNER_USER: ${{ secrets.QIT_USER || secrets.PARTNER_USER }}
          PARTNER_SECRET: ${{ secrets.QIT_ACCESS_TOKEN || secrets.PARTNER_SECRET }}
        run: |
          CLEAN_USER="$(echo "${PARTNER_USER}" | tr -d '[:space:]')"
          CLEAN_SECRET="$(echo "${PARTNER_SECRET}" | tr -d '[:space:]')"
          if [ -z "${CLEAN_USER}" ] || [ -z "${CLEAN_SECRET}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::QIT partner credentials (QIT_USER/PARTNER_USER, QIT_ACCESS_TOKEN/PARTNER_SECRET) not set. Skipping remote managed tests."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
            vendor/bin/qit partner:add --user="${CLEAN_USER}" --qit_token="${CLEAN_SECRET}"
          fi

      - name: Run QIT validation test
        if: steps.partner.outputs.configured == 'true'
        env:
          PLUGIN_ZIP: ${{ steps.build.outputs.zip }}
        run: |
          vendor/bin/qit run:validation gemini-enterprise-for-cx --zip="${PLUGIN_ZIP}"

      - name: Run QIT security test
        if: (success() || failure()) && steps.partner.outputs.configured == 'true'
        env:
          PLUGIN_ZIP: ${{ steps.build.outputs.zip }}
        run: |
          vendor/bin/qit run:security gemini-enterprise-for-cx --zip="${PLUGIN_ZIP}"

      - name: Run QIT activation test
        if: (success() || failure()) && steps.partner.outputs.configured == 'true'
        env:
          PLUGIN_ZIP: ${{ steps.build.outputs.zip }}
        run: |
          # QIT keeps Playwright's output in its report and hides the report
          # URL in CI unless asked; without it a failure says only how many
          # tests failed.
          vendor/bin/qit run:activation gemini-enterprise-for-cx --zip="${PLUGIN_ZIP}" --print-report-url

      - name: Print QIT test failures
        if: failure() && steps.partner.outputs.configured == 'true'
        shell: python3 {0}
        run: |
          # Prints the failed tests from QIT's CTRF reports, Playwright's
          # error-context files and the WordPress debug log, which QIT leaves
          # on the runner and otherwise never writes to the job log.
          import glob, json, os

          roots = sorted(glob.glob('/tmp/qit-e2e-artifacts-*') + glob.glob('/tmp/qit-results-*'))
          if not roots:
              print('No QIT results directories found under /tmp.')
          files = []
          for root in roots:
              for base, _, names in os.walk(root):
                  files.extend(os.path.join(base, n) for n in names)

          print('::group::QIT results files')
          for f in sorted(files):
              print(f)
          print('::endgroup::')

          seen = set()
          for f in sorted(files):
              if not f.endswith('.json'):
                  continue
              try:
                  with open(f, encoding='utf-8') as fh:
                      tests = json.load(fh).get('results', {}).get('tests', [])
              except (ValueError, OSError, AttributeError):
                  continue
              for t in tests:
                  if not isinstance(t, dict) or t.get('status') not in ('failed', 'timedOut', 'interrupted'):
                      continue
                  key = (t.get('name'), t.get('message'))
                  if key in seen:
                      continue
                  seen.add(key)
                  print('::error title=QIT test failed::' + str(t.get('name')))
                  print('::group::FAILED: ' + str(t.get('name')))
                  for field in ('suite', 'filePath', 'status', 'duration', 'message', 'trace'):
                      if t.get(field):
                          print(f'{field}: {t[field]}')
                  print('::endgroup::')
          if not seen:
              print('No failed tests found in CTRF reports.')

          for f in sorted(files):
              if os.path.basename(f) == 'error-context.md' or f.endswith('debug-prepared.log') or os.path.basename(f) == 'debug.log':
                  print('::group::' + f)
                  with open(f, encoding='utf-8', errors='replace') as fh:
                      print(fh.read()[-20000:])
                  print('::endgroup::')

      - name: Upload QIT results
        if: failure() && steps.partner.outputs.configured == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qit-results
          path: |
            /tmp/qit-e2e-artifacts-*
            /tmp/qit-results-*
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload plugin zip
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qit-plugin-zip
          path: dist/*.zip
          if-no-files-found: ignore
          retention-days: 7
